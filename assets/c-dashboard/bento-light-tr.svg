<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
<title id="t">Kısaca / At a glance</title>
<desc id="d">Türkçe ve İngilizce etiketli altı karolu özet. Rol: 2021'den beri reklam, topluluk ve marka iletişimi deneyimi. Öğrenim: İstinye Üniversitesi, Bilişim Güvenliği Teknolojisi önlisansı, beklenen 2027. Üretim: güvenlik araçları; HTTP başlık analizi, tünel denetimi, sızma testi ders laboratuvarları. Ağ: Türkçe OpenWRT router rehberleri, altyapı sorgusu ve IPv6 testi. Eğitimler: TryHackMe yolları, Cisco NetAcad, BTK Akademi ve TEKNOFEST CTF dahil 22 kayıt. Tasarım: Nraphy ve İnternet Özgürlüğü Girişimi için gönüllü tasarım.</desc>

<defs><clipPath id="card"><rect width="1200" height="600" rx="24"/></clipPath></defs>
<g clip-path="url(#card)">
