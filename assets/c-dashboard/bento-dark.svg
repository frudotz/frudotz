<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
<title id="t">At a glance / Kısaca</title>
<desc id="d">Six-tile overview with English and Turkish labels. Role: advertising, community and brand communications experience since 2021. Study: Information Security Technology at İstinye University, expected 2027. Build: security tools — HTTP header analyzer, tunnel auditor, pentest course labs. Network: OpenWRT router guides in Turkish, infrastructure lookup and an IPv6 test. Training: 22 records including TryHackMe paths, Cisco NetAcad, BTK Akademi and TEKNOFEST CTF. Design: volunteer design for Nraphy and İnternet Özgürlüğü Girişimi.</desc>

