<title id="t">Proje kartı: Cloudflared Tunnel Auditor</title>
<desc id="d">Mavi kart: Tunnel Auditor, sunucudaki cloudflared kurulumunu hatalı yapılandırma ve dışa açıklık için denetler; bulguları kritik, uyarı ve bilgi olarak raporlar. Shell ile yazıldı. İç içe tünel yaylarıyla süslenmiş.</desc>

