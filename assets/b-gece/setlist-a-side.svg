<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
<title id="t">A tarafı: proje listesi</title>
<desc id="d">Kaset temalı proje listesi, yedi parça: 01 SecOps Engine, HTTP güvenlik başlığı analizi (Rust); 02 CF Tunnel Auditor, cloudflared yapılandırma denetimi (Shell); 03 Nginx QUIC Lab, sızma testi dersi laboratuvarı BGT006 (Python); 04 Altyapı Sorgulama, Türkiye geniş bant altyapı sorgusu (JavaScript); 05 CS2 Güven Skoru, Steam hesabı güven sinyalleri (Cloudflare Workers); 06 IPv6 Test, v6.frudotz.com (HTML); 07 OpenWRT rehberleri, Türkçe.</desc>

<defs><clipPath id="card"><rect width="1200" height="600" rx="24"/></clipPath></defs>
<g clip-path="url(#card)">
